services:
  postgres:
    image: postgres:16
    container_name: clinicafisio.db
    environment:
      POSTGRES_DB: clinicafisio
      POSTGRES_USER: clinicafisio
      POSTGRES_PASSWORD: clinicafisio123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: