spring:
  application:
    name: clinicafisio

  datasource:
    url: jdbc:postgresql://localhost:5432/clinicafisio
    username: $[DB_USER]
    password: $[DB_PASSWORD]
    driver-classs-name: org.postgreesql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect


  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  server:
    port:8080

